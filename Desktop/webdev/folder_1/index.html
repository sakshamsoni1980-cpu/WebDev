<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="3px solid" cellpadding="10" cellspacing="5" width="80%" align="center">
        <caption><b>Quarterly Sales Report (INR)</b></caption>
        <thead bgcolor = "dimgrey" align="center">
            <tr>
            <th>Category</th>
            <th>Product</th>
            <th>Q1 Sales</th>
            <th width="20%">Q2 Sales</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" align="left" width="20%" valign="top">Electronics</td>
                <td width="20%" align="left">Smartphone</td>
                <td align="right">₹4,72,450</td>
                <td align="right" width="20%">₹5,85,838</td>
            </tr>
            <tr>
                <td>Laptops</td>
                <td align="right">₹8,03,165</td>
                <td align="right" width="20%">₹8,59,859</td>
            </tr>
            <tr bgcolor="darkgrey">
                <td colspan="2" align="left" width="40%"><b>Total Gross</b></td>
                <td width="20%" align="right"><b>₹12,75,615</b></td>
                <td width="20%" align="right"><b>₹14,45,697</b></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
